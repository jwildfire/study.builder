# ADaM subject-level table, from the raw participants table. One row per
# participant. TRTSDT is each participant's day one, which the other ADaM
# tables count study days from.
meta:
  Type: ADaM
  ID: ADSL
  Description: Subject-level analysis table
  Priority: 1
  File: adsl.csv
  Domain: subject
spec:
  Raw_SUBJ:
    subjid:
      type: character
    invid:
      type: character
    sex:
      type: character
    race:
      type: character
    timeonstudy:
      type: integer
    firstdosedate:
      type: Date
    enrolldt:
      type: Date
steps:
  - output: ADaM_ADSL
    name: workr::RunQuery
    params:
      df: Raw_SUBJ
      strQuery: "SELECT subjid AS USUBJID, 'All participants' AS ARM, invid AS SITEID, sex AS SEX, race AS RACE, CAST(timeonstudy AS INTEGER) AS EOSDY, COALESCE(CAST(firstdosedate AS DATE), CAST(enrolldt AS DATE)) AS TRTSDT FROM df ORDER BY subjid"
# Where each column came from. study.builder reads this block; workr does not.
columns:
  USUBJID: { from: Raw_SUBJ.subjid, how: Copied }
  ARM: { from: '', how: "A label of study.builder's: gsm.datasim makes no treatment arms" }
  SITEID: { from: Raw_SUBJ.invid, how: Copied }
  SEX: { from: Raw_SUBJ.sex, how: Copied }
  RACE: { from: Raw_SUBJ.race, how: Copied }
  EOSDY: { from: Raw_SUBJ.timeonstudy, how: Copied }
  TRTSDT:
    {
      from: 'Raw_SUBJ.firstdosedate, Raw_SUBJ.enrolldt',
      how: 'Derived: the first dose date, or the enrolment date for a participant with no dose'
    }
